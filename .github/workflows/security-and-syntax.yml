name: Security and syntax checks

on:
  push:
    branches:
      - feature/complete-8-microservices
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Validate JavaScript syntax
        run: |
          find services shared scripts tests gateway event-bus registry public/js -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Run security regression tests
        run: npm run test:security
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_test_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_test_only
      JWT_SECRET: ci_test_jwt_not_for_production
      INTERNAL_API_KEY: ci_test_internal_not_for_production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Prepare eight MySQL schemas
        run: npm run db:init
      - name: Exercise leave and shift workflows
        run: npm run test:features
