name: Security and syntax checks

on:
  push:
    branches:
      - feature/complete-8-microservices
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Validate JavaScript syntax
        run: |
          find services shared scripts tests gateway event-bus registry public/js -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Run security regression tests
        run: npm run test:security
      - name: Check UI data handling
        run: npm run test:ui
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_test_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_test_only
      JWT_SECRET: ci_test_jwt_not_for_production
      INTERNAL_API_KEY: ci_test_internal_not_for_production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Prepare eight MySQL schemas
        run: npm run db:init
      - name: Exercise leave and shift workflows
        run: npm run test:features
      - name: Verify transactional account registration
        run: npm run test:registration
      - name: Boot full SOA stack and test all eight services via Gateway
        run: |
          # Registrar intentionally skips NODE_ENV=test; enable discovery for this full-stack E2E run.
          NODE_ENV=development npm start > /tmp/htqlns-soa.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true; tail -n 55 /tmp/htqlns-soa.log' EXIT
          READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1               && curl -fsS http://127.0.0.1:3500/health >/dev/null 2>&1               && curl -fsS http://127.0.0.1:3600/health >/dev/null 2>&1               && node -e "fetch('http://127.0.0.1:3500/health').then(r => r.json()).then(x => process.exit(x.instancesCount >= 8 ? 0 : 1)).catch(() => process.exit(1))"; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Full SOA stack did not become healthy'
            exit 1
          fi
          npm run test:e2e
